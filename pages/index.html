{% extends "base.html" %}

{% block extra_css %}
<style>
    .gig-banner {
        position: fixed;
        display: block;
        z-index: 1100;
        right: 16px;
        bottom: 24px;
        left: 16px;
        width: auto;
        max-width: 560px;
        margin: 0 auto;
        padding: 18px 22px;
        color: white;
        background: transparent;
        box-shadow: 0 0 20px rgba(66, 220, 163, 0.18);
        text-align: left;
        text-decoration: none;
        animation: gig-banner-sequence 1.4s ease-out 4s both;
    }

    .gig-banner:hover,
    .gig-banner:focus {
        color: white;
        text-decoration: none;
    }

    .gig-banner:focus-visible {
        outline: 2px solid #42DCA3;
        outline-offset: 5px;
    }

    .gig-banner::before,
    .gig-banner::after {
        position: absolute;
        z-index: -1;
        content: "";
        clip-path: polygon(
            1% 3%, 5% 1%, 9% 2%, 14% 0, 19% 2%, 24% 1%, 29% 3%,
            34% 1%, 39% 2%, 44% 0, 49% 2%, 54% 1%, 59% 3%, 64% 1%,
            69% 2%, 74% 0, 79% 2%, 84% 1%, 89% 3%, 94% 1%, 99% 3%,
            98% 9%, 100% 15%, 98% 21%, 99% 27%, 97% 33%, 99% 39%,
            98% 45%, 100% 51%, 98% 57%, 99% 63%, 97% 69%, 99% 75%,
            98% 81%, 100% 87%, 98% 93%, 99% 98%, 94% 99%, 89% 97%,
            84% 100%, 79% 98%, 74% 99%, 69% 97%, 64% 100%, 59% 98%,
            54% 99%, 49% 97%, 44% 100%, 39% 98%, 34% 99%, 29% 97%,
            24% 100%, 19% 98%, 14% 99%, 9% 97%, 4% 99%, 1% 96%,
            2% 90%, 0 84%, 2% 78%, 1% 72%, 3% 66%, 1% 60%,
            2% 54%, 0 48%, 2% 42%, 1% 36%, 3% 30%, 1% 24%,
            2% 18%, 0 12%
        );
    }

    .gig-banner::before {
        inset: 0;
        background: rgba(66, 220, 163, 0.4);
    }

    .gig-banner::after {
        inset: 2px;
        background: rgba(0, 0, 0, 0.84);
    }

    .gig-banner h2 {
        position: relative;
        z-index: 1;
        margin: 0 0 8px;
        color: #42DCA3;
        font-size: 18px;
        letter-spacing: 0.5px;
    }

    .gig-banner p {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
    }

    .gig-banner-cta {
        position: relative;
        z-index: 1;
        display: inline-block;
        margin-top: 8px;
        font-family: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }

    @keyframes gig-banner-sequence {
        0% {
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px) scale(0.92);
        }
        50% {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        58%, 100% { transform: translateX(0) scale(1); }
        65% { transform: translateX(-6px) scale(1); }
        72% { transform: translateX(6px) scale(1); }
        79% { transform: translateX(-4px) scale(1); }
        86% { transform: translateX(4px) scale(1); }
        93% { transform: translateX(-2px) scale(1); }
    }

    @media (max-width: 480px) {
        .gig-banner {
            right: 12px;
            bottom: 12px;
            left: 12px;
            padding: 15px 16px;
        }

        .gig-banner h2 {
            font-size: 16px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .gig-banner {
            animation-duration: 1ms;
        }
    }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
    (function () {
        var banner = document.querySelector('.gig-banner');
        if (!banner) {
            return;
        }

        var hideAfter = new Date('2027-01-15T00:00:00+01:00').getTime();

        function hideExpiredBanner() {
            var remaining = hideAfter - Date.now();
            if (remaining <= 0) {
                banner.hidden = true;
                return;
            }

            window.setTimeout(hideExpiredBanner, Math.min(remaining, 24 * 60 * 60 * 1000));
        }

        hideExpiredBanner();
    })();
</script>
{% endblock %}
